<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cityscape variants</title>
    <!-- Comparison sheet (22 Nov 2026) for the cityscape skyline: three variants drawn by the design workflow and today's geometry. The owner picked B, Mixed street. Every variant is
         drawn inside the same page mock with the app's current state
         treatment (CitySkyline.tsx): sky gradient, glow, clouds, far/mid/near
         rows, veils (masked), windows from 640 px. Only the buildings differ.
         Variants register in window.VARIANTS from variant-*.js files.
         ?only=<id> limits the sheet to one variant. -->
    <style>
      :root {
        --surface-light: #f5f8fa;
        --secondary: #64a9ff;
        --text-dark: #182435;
        --text-dark-muted: #4a5a6e;
        --warning: #f5b84b;
        --rule: #d3dce6;
        --bg: #080f1c;
        --within-top: color-mix(
          in oklab,
          var(--secondary) 46%,
          var(--surface-light)
        );
        --above-top: color-mix(in oklab, var(--secondary) 14%, var(--rule));
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: #fff;
        color: var(--text-dark);
        font:
          15px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 1320px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
      h1 {
        font-size: 26px;
        margin: 0;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 2px;
      }
      h3 {
        font-size: 14px;
        margin: 6px 0 0;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 80ch;
      }
      .muted {
        color: var(--text-dark-muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: flex-start;
      }
      .frame {
        border: 1px solid var(--rule);
        border-radius: 8px;
        overflow: hidden;
      }
      .page {
        position: relative;
        overflow: hidden;
        transform-origin: 0 0;
      }
      .abs {
        position: absolute;
      }
      .fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .mask {
        -webkit-mask-image: linear-gradient(transparent, black 60%);
        mask-image: linear-gradient(transparent, black 60%);
      }
      .header {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 64px;
        background: var(--bg);
      }
      .card {
        position: absolute;
        left: 6%;
        right: 6%;
        top: 120px;
        height: 150px;
        background: var(--surface-light);
        border: 1px solid var(--rule);
        border-radius: 10px;
      }
      .title {
        position: absolute;
        left: 6%;
        top: 76px;
        font-weight: 700;
        font-size: 26px;
        color: var(--text-dark);
      }
      .phonebar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 56px;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <main id="out"></main>
    <script>
      window.VARIANTS = window.VARIANTS || [];
    </script>
    <script>
      // Variant A: Housing society. Mid row = mid-rise society blocks (balcony
      // bands, stair/lift cores above the roof, tanks on legs), one terraced block,
      // one block with deep recessed balconies, three glass offices; far = slim
      // towers over low blocks; near = low houses (a few shops), taller flats with
      // deep chhajjas and stair rooms, one small office with strip glazing.
      (() => {
        const G = 160;
        const n = (v) => Math.round(v * 10) / 10;
        const R = (x, y, w, h) => `M${n(x)} ${n(y)}h${n(w)}v${n(h)}h${n(-w)}z`;
        const B = (x, w, h) => R(x, G - h, w, h);
        const P = (d) => `<path d="${d}"/>`;
        // Water tank on two legs standing on `base`, drawn as one outline.
        const tank = (cx, base, w, h, l, lid) => {
          const x0 = cx - w / 2,
            y = base - l - h;
          const legs = `v${h}h-1v${l}h-1.6v${-l}h${n(5.2 - w)}v${l}h-1.6v${-l}h-1`;
          return lid
            ? `M${n(x0 + w / 4)} ${n(y - 1.2)}h${n(w / 2)}v1.2h${n(w / 4)}${legs}v${-h}h${n(w / 4)}z`
            : `M${n(x0)} ${n(y)}h${w}${legs}z`;
        };
        // mid tanks: standard (lid), tall, wide, small, small pair; L = lift room
        const T = (cx, b) => tank(cx, b, 9, 5, 3, 1);
        const Tt = (cx, b) => tank(cx, b, 7, 7, 3, 1);
        const Tw = (cx, b) => tank(cx, b, 13, 4.5, 2.5);
        const Ts = (cx, b) => tank(cx, b, 6, 4, 2.5);
        const Tp = (cx, b) => Ts(cx - 3.2, b) + Ts(cx + 3.2, b);
        const L = (cx, b) => R(cx - 3.5, b - 4, 7, 4);
        // near tanks: standard (lid), small, wide, small pair
        const N = (cx, b) => tank(cx, b, 10, 6, 3.5, 1);
        const Ns = (cx, b) => tank(cx, b, 7, 5, 3);
        const Nw = (cx, b) => tank(cx, b, 14, 5, 3);
        const Np = (cx, b) => Ns(cx - 4, b) + Ns(cx + 4, b);

        // ---- far: slim towers (setback top tier), one flat slab, low distant blocks
        const tower = (x, w, h) => B(x, w, h - 6) + B(x + 3, w - 6, h);
        const far = P(
          [
            [-10, 34, 48],
            [24, 30, 58],
            [54, 40, 44],
            [94, 30, 62],
            [124, 26, 50],
            [166, 36, 56],
            [202, 30, 66],
            [232, 40, 52],
            [272, 34, 60],
            [306, 30, 48],
            [336, 44, 64],
            [380, 36, 54],
            [432, 40, 60],
            [472, 30, 50],
            [502, 38, 66],
            [558, 32, 58],
            [590, 40, 50],
            [630, 30, 62],
            [660, 30, 52],
            [724, 34, 60],
            [758, 52, 50],
          ]
            .map(([x, w, h]) => B(x, w, h))
            .join('') +
            B(-10, 820, 12) +
            tower(8, 18, 76) +
            tower(150, 16, 86) +
            B(266, 22, 78) +
            tower(416, 16, 84) +
            tower(540, 18, 88) +
            tower(690, 14, 82),
        );

        // ---- mid: housing-society blocks and offices
        let midDetail = '';
        // Society block: roof slab, stair/lift cores [dx, topper] above the roof,
        // balcony bands either side of each core. o.tanks: [[dx, fn]] on the roof;
        // o.side: chhajja slabs on one flank (1 right, -1 left); o.step: [dx, w, dh]
        // raised part; o.win: older block, hooded windows in the first bay only.
        const apt = (x, w, h, cores, o = {}) => {
          const top = G - h;
          let d = B(x, w, h) + R(x - 1.5, top, w + 3, 2);
          if (o.step) {
            const [sx, sw, dh] = o.step;
            d +=
              R(x + sx, top - dh, sw, dh) +
              R(x + sx - 1.5, top - dh, sw + 3, 2);
            for (let y = top - dh + 5; y < top; y += 7)
              midDetail += R(x + sx + 2.5, y, sw - 5, 2);
          }
          for (const [c, k] of cores)
            d += R(x + c, top - 8, 11, 8) + (k ? k(x + c + 5.5, top - 8) : '');
          for (const [dx, k] of o.tanks || []) d += k(x + dx, top);
          if (o.side)
            for (let y = top + 6; y < G - 10; y += 7)
              d += R(o.side > 0 ? x + w : x - 3, y, 3, 2.5);
          const edges = [0, ...cores.flatMap(([c]) => [c, c + 11]), w];
          for (
            let y = top + (o.win ? 8 : 6);
            y < G - (o.win ? 12 : 10);
            y += o.win ? 8 : 7
          )
            for (let i = 0; i < edges.length; i += 2) {
              const a = x + edges[i] + 2.5,
                b = x + edges[i + 1] - 2.5;
              if (o.win) {
                if (i === 0) {
                  midDetail += R(a - 1, y - 2, b - a + 2, 1.2);
                  for (let xx = a; xx + 3 <= b; xx += 8)
                    midDetail += R(xx, y, 3, 3.5);
                }
              } else if (b - a > 8) midDetail += R(a, y, b - a, 2);
            }
          return P(d);
        };
        // Terraced block: tiers stepping down to the right, each roof slab
        // projecting over the next tier; core and tank on the top tier.
        const terrace = (x, tw, hs) => {
          let d = '';
          hs.forEach(
            (h, i) =>
              (d +=
                B(x + i * tw, tw, h) +
                R(x + i * tw - (i ? 0 : 1.5), G - h, tw + (i ? 3 : 4.5), 2)),
          );
          const top = G - hs[0];
          d +=
            R(x + 4, top - 8, 11, 8) +
            T(x + 9.5, top - 8) +
            Ts(x + tw + 9, G - hs[1]);
          for (let y = top + 6; y < G - 10; y += 7)
            midDetail += R(
              x + 2.5,
              y,
              hs.filter((h) => G - h + 6 <= y).length * tw - 5,
              2,
            );
          return P(d);
        };
        // Block with deep recessed balconies: lit slab edges and piers frame the
        // dark recesses; slab ends project past both flanks; two-tier lift core.
        const recessed = (x, w, h, piers, core) => {
          const top = G - h;
          let d =
            B(x, w, h) +
            R(x - 1.5, top, w + 3, 2) +
            R(x + core, top - 8, 11, 8) +
            R(x + core + 2, top - 12, 7, 4);
          for (let y = top + 7; y < G - 8; y += 7) {
            d += R(x - 3, y, 3, 2) + R(x + w, y, 3, 2);
            midDetail += R(x + 1, y, w - 2, 1.5);
          }
          for (const p of piers) midDetail += R(x + p, top + 3, 2, h - 11);
          return P(d);
        };
        // Glass office: vertical glazing bands; setback crown, or a lift room off-centre.
        const office = (x, w, h, crown) => {
          const top = G - h;
          const d =
            B(x, w, h) +
            (crown
              ? R(x + 3, top - crown, w - 6, crown)
              : R(x + w - 11, top - 5, 8, 5));
          for (let xx = x + 3; xx + 2 <= x + w - 3; xx += 6)
            midDetail += R(xx, top + 4, 2, h - 8);
          return P(d);
        };
        const mid =
          P(B(-10, 820, 12)) +
          apt(-12, 50, 44, [[28]]) +
          office(42, 28, 62, 4) +
          apt(76, 62, 52, [[18, T]], { tanks: [[46, Tw]] }) +
          P(B(142, 36, 30) + R(164, 122, 9, 8)) +
          apt(182, 38, 46, [[16, Tt]]) +
          terrace(222, 20, [58, 47, 36]) +
          recessed(284, 56, 60, [1, 18, 35, 47, 53], 36) +
          office(346, 34, 72, 5) +
          apt(386, 78, 48, [
            [12, L],
            [55, Tp],
          ]) +
          apt(470, 50, 38, [], { step: [0, 26, 12], tanks: [[38, Ts]] }) +
          apt(526, 48, 58, [[30, T]]) +
          office(578, 30, 64, 0) +
          apt(614, 64, 54, [[36]], { side: -1, win: 1, tanks: [[14, T]] }) +
          P(B(684, 40, 36) + Tw(700, 124)) +
          apt(728, 54, 60, [[14, L]], { tanks: [[40, T]] }) +
          apt(786, 30, 44, [[10]]);

        // ---- near: low houses, a few shops, taller flats and a small office
        let nearDetail = '';
        // One row of windows: 'sq' squares, 'pr' tall with a mullion, 'wd' wide.
        const wins = (x, w, y, kind, pitch) => {
          for (
            let xx = x + 4;
            xx + (kind === 'wd' ? 8 : 4.6) <= x + w - 3;
            xx += pitch
          )
            nearDetail +=
              kind === 'pr'
                ? R(xx, y, 2, 5.5) + R(xx + 2.6, y, 2, 5.5)
                : kind === 'wd'
                  ? R(xx, y, 8, 3)
                  : R(xx, y, 3.5, 4.5);
        };
        // Low G+1 house: parapet, deep sunshade over the ground floor. o.room: stair
        // room dx; o.t: [dx, tank]; o.shop: shutter bays (half raised, lit below);
        // o.win: [kind, pitch] upper-floor windows; o.wall: compound wall of a lane on the left.
        const low = (x, w, h, o = {}) => {
          const top = G - h;
          let d =
            B(x, w, h) +
            R(x - 1, top, w + 2, 2) +
            R(x - 2.5, G - 10, w + 5, 2.5);
          if (o.wall) d += B(x - o.wall, o.wall, 5);
          if (o.room != null) d += R(x + o.room, top - 6, 9, 6);
          if (o.t) d += o.t[1](x + o.t[0], top);
          if (o.shop) {
            const bw = (w - 6 - (o.shop - 1) * 2) / o.shop;
            for (let i = 0; i < o.shop; i++)
              nearDetail += R(x + 3 + i * (bw + 2), G - 3, bw, 3);
          }
          if (o.win && h >= 19) wins(x, w, top + 3.5, ...o.win);
          return P(d);
        };
        // Taller flat: parapet, a deep chhajja over every floor (projects 3),
        // windows under each, stair room, tanks [[dx, tank, onRoom]].
        const flat = (x, w, h, o) => {
          const top = G - h;
          let d = B(x, w, h) + R(x - 1.5, top, w + 3, 2.5);
          for (let y = top + 9.5; y < G - 8; y += 9.5)
            d += R(x - 3, y, w + 6, 2.5);
          if (o.room != null) d += R(x + o.room, top - 7, 12, 7);
          for (const [dx, k, onRoom] of o.t)
            d += k(x + dx, onRoom ? top - 7 : top);
          for (let y = top + 3.5; y + 5 <= G - 10; y += 9.5)
            wins(x, w, y, ...o.win);
          return P(d);
        };
        // Small office: plain block, thin strip glazing per floor (split in two),
        // lift room off-centre, lower side wing.
        const nOffice = (x, w, h, ww) => {
          const top = G - h;
          for (let y = top + 5; y <= G - 9; y += 7)
            nearDetail +=
              R(x + 3, y, w / 2 - 4, 1.5) + R(x + w / 2 + 1, y, w / 2 - 4, 1.5);
          nearDetail +=
            R(x + w + 4, G - 24, ww - 8, 2.5) +
            R(x + w + 4, G - 15, ww - 8, 2.5);
          return P(
            B(x, w, h) +
              R(x + w - 12, top - 6, 9, 6) +
              B(x + w, ww, 30) +
              R(x + w, G - 30, ww + 1, 2),
          );
        };
        const near =
          flat(-10, 50, 32, { room: 30, t: [[12, N]], win: ['pr', 13] }) +
          low(40, 30, 20, { win: ['wd', 13] }) +
          low(70, 31, 16) +
          low(107, 30, 22, { wall: 6, shop: 2, t: [15, Ns] }) +
          flat(137, 46, 40, { room: 6, t: [[34, N]], win: ['sq', 12] }) +
          low(183, 28, 18, { room: 17 }) +
          low(217, 33, 24, { wall: 6, t: [22, N], win: ['pr', 12] }) +
          low(250, 27, 15) +
          low(277, 36, 23, { shop: 3 }) +
          low(313, 33, 19, { room: 4, win: ['wd', 12] }) +
          flat(346, 44, 34, { room: 4, t: [[10, N, 1]], win: ['wd', 13] }) +
          low(390, 30, 20, { win: ['sq', 10] }) +
          low(420, 31, 16, { t: [16, Np] }) +
          low(457, 32, 22, { wall: 6, shop: 1 }) +
          low(489, 33, 19, { win: ['wd', 13] }) +
          nOffice(522, 34, 44, 20) +
          low(576, 30, 19, { room: 17, win: ['pr', 11] }) +
          low(606, 28, 24, { t: [11, Nw], win: ['sq', 9] }) +
          low(640, 40, 18, { wall: 6 }) +
          flat(680, 50, 34, { room: 30, t: [[36, N, 1]], win: ['pr', 15] }) +
          low(730, 32, 18) +
          low(762, 50, 21, { room: 34, win: ['pr', 13] });

        window.VARIANTS.push({
          id: 'a',
          name: 'Housing society',
          idea: 'Middle row of housing-society mid-rises (balcony bands, stair/lift cores above flat roofs, tanks on legs in four sizes, some cores bare), one terraced block and one with deep recessed balconies, three glass offices; far row of slim towers over low blocks; near row of low houses (three shops), taller flats with deep chhajjas and stair rooms, and a small office with strip glazing.',
          far,
          mid,
          midDetail: P(midDetail),
          near,
          nearDetail: P(nearDetail),
        });
      })();
    </script>
    <script>
      // Variant B: Mixed street. The far row is one skyline outline; mid and near are one <path> of rect subpaths per building.
      (() => {
        const G = 160;
        const f = (n) => +n.toFixed(1);
        // rect subpath, clipped to the allowed overhang x -10..810
        const R = (x, y, w, h) => {
          const a = Math.max(x, -10),
            b = Math.min(x + w, 810);
          return `M${f(a)} ${f(y)}h${f(b - a)}v${f(h)}h${f(a - b)}z`;
        };
        const P = (d) => (d ? `<path d="${d}"/>` : '');
        // Water tank on a steel stand, standing on roof line t: drum, platform, two legs (8.5 tall).
        const tank = (cx, t) =>
          R(cx - 5, t - 8.5, 10, 5.5) +
          R(cx - 6, t - 4.2, 12, 1.4) +
          R(cx - 5, t - 3, 2, 3) +
          R(cx + 3, t - 3, 2, 3);

        // FAR: a continuous low range plus soft towers (k 0 flat, 1 one-sided setback, 2 low roof box).
        const LOW = [
          [-10, 28, 40],
          [18, 22, 48],
          [40, 34, 36],
          [74, 26, 44],
          [100, 30, 34],
          [130, 20, 50],
          [150, 36, 38],
          [186, 24, 46],
          [210, 30, 34],
          [240, 22, 42],
          [262, 34, 48],
          [296, 26, 36],
          [322, 30, 44],
          [352, 22, 38],
          [374, 36, 46],
          [410, 24, 34],
          [434, 30, 42],
          [464, 22, 50],
          [486, 34, 36],
          [520, 26, 44],
          [546, 30, 38],
          [576, 22, 48],
          [598, 34, 36],
          [632, 24, 42],
          [656, 30, 34],
          [686, 22, 46],
          [708, 34, 38],
          [742, 26, 44],
          [768, 42, 36],
        ];
        const TOW = [
          [6, 20, 66, 0],
          [36, 22, 82, 1],
          [118, 20, 76, 0],
          [134, 26, 62, 2],
          [176, 18, 86, 1],
          [244, 24, 72, 0],
          [262, 16, 84, 2],
          [326, 22, 66, 0],
          [374, 20, 88, 1],
          [392, 14, 74, 0],
          [446, 30, 70, 2],
          [500, 18, 84, 0],
          [520, 24, 66, 1],
          [600, 20, 78, 2],
          [628, 26, 60, 0],
          [700, 16, 82, 1],
          [742, 26, 68, 2],
          [788, 18, 76, 0],
        ];
        const tower = ([x, w, h, k], i) => {
          const t = G - h;
          if (k === 1)
            return [
              [x, w, t + 10],
              [i % 2 ? x + 5 : x, w - 5, t],
            ];
          if (k === 2)
            return [
              [x, w, t + 3],
              [x + 4, w - 8, t],
            ];
          return [[x, w, t]];
        };
        // The far row is one flat fill with no overhangs, so it is drawn as one outline: the highest roof over each x.
        const FR = [
          ...LOW.map(([x, w, h]) => [x, w, G - h]),
          ...TOW.flatMap(tower),
        ];
        const xs = [...new Set(FR.flatMap(([x, w]) => [x, x + w]))].sort(
          (p, q) => p - q,
        );
        let far = 'M-10 160',
          last;
        for (let j = 0; j < xs.length - 1; j++) {
          const top = Math.min(
            ...FR.filter(([x, w]) => x <= xs[j] && x + w >= xs[j + 1]).map(
              (r) => r[2],
            ),
          );
          if (top !== last)
            ((far += (j ? 'H' + f(xs[j]) : '') + 'V' + f(top)), (last = top));
        }
        far = P(far + 'H810V160z');

        // MID: F older flats with chhajjas (s: raised half), S society blocks with balconies and a stair/lift core (c),
        // O glass offices with vertical fins (k: box = plant room, set = setback top).
        const MID = [
          ['F', -10, 40, 44, { s: 'r' }],
          ['S', 32, 52, 58, { c: [8] }],
          ['O', 87, 30, 70, { k: 'box' }],
          ['F', 119, 28, 40, { bare: 1 }],
          ['S', 150, 46, 62, { c: [17] }],
          ['O', 199, 32, 72, { k: 'set' }],
          ['F', 234, 42, 46, { s: 'l' }],
          ['S', 281, 58, 54, { c: [8, 40], cw: 10 }],
          ['O', 345, 24, 64, { bare: 1 }],
          ['F', 369, 30, 42, {}],
          ['O', 405, 38, 74, { k: 'box' }],
          ['S', 444, 50, 60, { c: [34] }],
          ['F', 494, 38, 48, { s: 'r' }],
          ['O', 540, 28, 66, {}],
          ['S', 570, 50, 56, { c: [4] }],
          ['F', 620, 32, 38, { bare: 1 }],
          ['O', 658, 34, 70, { k: 'set' }],
          ['S', 694, 54, 58, { c: [21] }],
          ['F', 748, 30, 44, { s: 'l' }],
          ['O', 783, 27, 62, { k: 'box' }],
        ];
        const mid = [],
          midDetail = [];
        for (const [type, x, w, h, o] of MID) {
          const t = G - h;
          let d = R(x, t, w, h),
            m = '';
          if (type === 'S') {
            const cw = o.cw || 12;
            for (const c of o.c) d += R(x + c, t - 8, cw, 8);
            // balcony slab (projecting) and one railing run under it, per floor
            for (let y = t + 6; y < G - 8; y += 8)
              ((d += R(x - 2, y, w + 4, 2)),
                (m += R(x + 2, y + 2, w - 4, 2.2)));
          } else if (type === 'O') {
            if (o.k === 'box') d += R(x + 5, t - 4, w - 10, 4);
            if (o.k === 'set')

          `<div class="title">Today in Pune</div>` +
          `<div class="card"></div>` +
          `<div class="abs" style="left:0;right:0;bottom:${bottom}px;height:${band}px">${city}</div>` +
          (bottom ? `<div class="phonebar"></div>` : '');
        return (
          `<div class="frame" style="width:${W * scale}px;height:${H * scale}px">` +
          `<div class="page" style="width:${W}px;height:${H}px;transform:scale(${scale})">${inner}</div></div>`
        );
      }

      let uid = 0;
      function fig(v, label, s) {
        return `<figure style="margin:0">${page(v, { uid: uid++, ...s })}<h3>${label}</h3></figure>`;
      }
      // A close-up of the city band alone: the page mock cropped to its
      // bottom `band` px (no phone bar), so details can be judged.
      function band(v, label, s) {
        const b = s.W >= 640 ? 176 : 128;
        const H = Math.max(b / 0.2, 640);
        const inner = page(v, { uid: uid++, ...s, H, scale: 1 })
          .replace(/<div class="phonebar"><\/div>/, '')
          .replace(/bottom:56px/, 'bottom:0px');
        return (
          `<figure style="margin:0"><div class="frame" style="width:${s.W * s.scale}px;height:${b * s.scale}px;position:relative">` +
          `<div style="position:absolute;left:0;bottom:0;transform-origin:0 100%;transform:scale(${s.scale})">${inner}</div></div><h3>${label}</h3></figure>`
        );
      }

      const only = new URLSearchParams(location.search).get('only');
      const out = document.getElementById('out');
      if (only === 'compare') {
        let c = '<h1>Cityscape variants: side by side</h1>';
        for (const id of ['current', 'a', 'b', 'c']) {
          const v = VARIANTS.find((x) => x.id === id);
          if (!v) continue;
          c +=
            `<section><h2>${id === 'current' ? 'Today' : id.toUpperCase() + '. ' + v.name}</h2><div class="row">` +
            band(v, '1280 px, within', {
              W: 1280,
              scale: 0.62,
              air: 'within',
              clouds: 0,
              glow: false,
            }) +
            band(v, '390 px phone, within', {
              W: 390,
              scale: 1.1,
              air: 'within',
              clouds: 0,
              glow: false,
            }) +
            `</div><div class="row" style="margin-top:8px">` +
            band(v, '1280 px, above', {
              W: 1280,
              scale: 0.62,
              air: 'above',
              clouds: 0,
              glow: false,
            }) +
            band(v, '390 px phone, loading', {
              W: 390,
              scale: 1.1,
              air: 'unknown',
              loading: true,
            }) +
            `</div></section>`;
        }
        out.innerHTML = c;
        throw new Error('compare done');
      }
      let html = `<h1>Cityscape variants</h1><p class="muted">Same page mock, same state treatment as the app today; only the buildings differ. Sizes are the brief's test viewports, scaled down.</p>`;
      for (const v of VARIANTS.filter((x) => !only || x.id === only)) {
        const D = { W: 1280, H: 720, scale: 0.42 };
        html +=
          `<section><h2>${v.id.toUpperCase()}. ${v.name}</h2><p class="muted">${v.idea}</p>` +
          `<div class="row">` +
          fig(v, 'Within the limit, partly cloudy, daylight', {
            ...D,
            air: 'within',
            clouds: 2,
            glow: true,
          }) +
          fig(v, 'Above the limit, clear, daylight', {
            ...D,
            air: 'above',
            clouds: 0,
            glow: true,
          }) +
          fig(v, 'No data (unknown)', {
            ...D,
            air: 'unknown',
            clouds: 0,
            glow: false,
          }) +
          fig(v, 'Loading (still silhouette)', {
            ...D,
            air: 'unknown',
            loading: true,
          }) +
          `</div><div class="row" style="margin-top:14px">` +
          band(v, 'Close-up: city band at 1280 px, within', {
            W: 1280,
            scale: 0.98,
            air: 'within',
            clouds: 0,
            glow: false,
          }) +
          band(v, 'Close-up: city band at 390 px (phone), within', {
            W: 390,
            scale: 1.6,
            air: 'within',
            clouds: 0,
            glow: false,
          }) +
          band(v, 'Close-up: city band at 1280 px, above', {
            W: 1280,
            scale: 0.98,
            air: 'above',
            clouds: 0,
            glow: false,
          }) +
          `</div><div class="row" style="margin-top:14px">` +
          fig(v, '320 × 640, within', {
            W: 320,
            H: 640,
            scale: 0.6,
            air: 'within',
            clouds: 1,
            glow: true,
          }) +
          fig(v, '390 × 844, above', {
            W: 390,
            H: 844,
            scale: 0.5,
            air: 'above',
            clouds: 0,
            glow: true,
          }) +
          fig(v, '768 × 1024, within', {
            W: 768,
            H: 1024,
            scale: 0.36,
            air: 'within',
            clouds: 2,
            glow: true,
          }) +
          `</div></section>`;
      }
      if (!only || only === 'overcast') {
        const v = VARIANTS[0];
        if (v) {
          const D = { W: 1280, H: 720, scale: 0.42 };
          html +=
            `<section><h2>Overcast: within vs above</h2><p class="muted">Today the overcast "within" sky is nearly the "above" sky. The proposal keeps the within hue, only muted.</p><div class="row">` +
            fig(v, 'Today: within, overcast', {
              ...D,
              air: 'within',
              clouds: 3,
              glow: false,
              overcastTop: OVERCAST.today.within,
            }) +
            fig(v, 'Proposal: within, overcast', {
              ...D,
              air: 'within',
              clouds: 3,
              glow: false,
              overcastTop: OVERCAST.proposal.within,
            }) +
            fig(v, 'Above, clear (for comparison)', {
              ...D,
              air: 'above',
              clouds: 0,
              glow: false,
            }) +
            fig(v, 'Above, overcast', {
              ...D,
              air: 'above',
              clouds: 3,
              glow: false,
              overcastTop: OVERCAST.proposal.above,
            }) +
            `</div></section>`;
        }
      }
      out.innerHTML = html;
    </script>
  </body>
</html>
