<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | AirAware AI</title>
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #f5f8fa;
        color: #182435;
        line-height: 1.5;
      }
      header {
        background: #080f1c;
        color: #f4f7fa;
        padding: 0 1rem;
      }
      header a {
        display: inline-flex;
        align-items: center;
        min-height: 4rem;
        color: #f4f7fa;
        font-size: 1.125rem;
        font-weight: 600;
        text-decoration: none;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.875rem;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 1px solid #182435;
        border-radius: 0.375rem;
        color: #182435;
        font-weight: 600;
      }
      .links a:first-child {
        background: #39d5c2;
        border-color: #39d5c2;
        color: #080f1c;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #1f6fd6;
        outline-offset: 2px;
      }
      header a:focus-visible {
        outline-color: #f4f7fa;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/app">AirAware AI</a>
    </header>
    <main>
      <h1>We couldn't find that page</h1>
      <p class="links">
        <a href="/app">Go to AirAware</a>
        <a href="/">Home</a>
      </p>
    </main>
  </body>
</html>
