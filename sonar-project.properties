# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml
# (automatic analysis is off for this project).
sonar.organization=gaikwadashutosh35
sonar.projectKey=gaikwadashutosh35_airaware-ai
sonar.projectName=AirAware AI
sonar.sourceEncoding=UTF-8

# SonarQube Cloud analyses the whole repository (its newer analysis scope
# ignores sonar.sources and sonar.tests). Unit tests and test-only helpers are
# not product code.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,server/src/test-fixtures/**,client/src/test/**

# Vitest coverage; CI makes the paths repo-relative before the scan.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
# Not measured by Vitest: the Playwright tests (they are tests) and the SQL
# migration (checked by the live Supabase test).
sonar.coverage.exclusions=e2e/**,supabase/**
